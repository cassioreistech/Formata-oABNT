[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formata-abnt"
version = "0.4.0"
description = "Aplicação desktop que formata documentos .docx nas normas ABNT"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.0",
    "customtkinter>=5.2.0",
    "tkinterdnd2>=0.4.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["formata_abnt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
