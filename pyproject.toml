[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formata-abnt"
version = "0.1.0"
description = "Lê e reformata documentos .docx segundo as normas ABNT (NBR 14724)"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
formata-abnt = "formata_abnt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["formata_abnt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
