[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formata-abnt"
version = "0.1.0"
description = "Sistema premium de formatação automática de documentos acadêmicos conforme normas ABNT"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Cassio Reis", email = "cassio@example.com" },
]
keywords = ["abnt", "formatacao", "documentos", "academicos", "tcc", "monografia"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
]

dependencies = [
    "python-docx>=1.1.0",
    "pydantic>=2.0",
    "typer>=0.9.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pdf = ["docx2pdf>=0.1.8"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
formata-abnt = "src.cli.app:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]